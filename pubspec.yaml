name: widgetboard
description: >
  A social Flutter app where users write to each other directly on home-screen
  widgets, share media, chat, and play mini games together (Tic-Tac-Toe, Racing,
  Ludo, Cards, Truth-or-Dare, Builder, etc.).

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.4

  # Networking & real-time
  socket_io_client: ^2.0.0
  http: ^1.2.0

  # Media picking & display
  image_picker: ^1.0.7
  video_player: ^2.8.0
  cached_network_image: ^3.4.1

  # Local storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  # Used to bridge notes from Flutter into the Android AppWidget (SharedPreferences).

  # Voice recording/playback
  record: ^6.2.1
  just_audio: ^0.9.36

  # UI / utilities
  intl: ^0.20.3
  uuid: ^4.4.2
  clipboard: ^3.0.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
